[project]
name = "oncall-multi-agent-poc"
version = "0.1.0"
description = "POC: multi-agent on-call system with severity gates and sandboxed runbooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["oncall_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
