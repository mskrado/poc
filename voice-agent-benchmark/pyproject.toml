[project]
name = "voice-agent-benchmark"
version = "0.1.0"
description = "POC: configurable voice-agent stack benchmark harness (latency, cost, reliability)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
voice-benchmark = "voice_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["voice_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
