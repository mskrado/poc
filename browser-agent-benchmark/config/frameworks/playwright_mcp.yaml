framework: playwright_mcp
enabled: true
adapter: playwright_mcp
description: Microsoft Playwright MCP server v1.1.0 driven by Claude over MCP tool use (DOM-based)
observation: dom
model: claude-3-7-sonnet
max_steps: 25
cost_per_task_usd: 0.11

# Hook points for a future live implementation (see frameworks/playwright_mcp.py).
live:
  transport: stdio
  command: npx
  args: ["@playwright/mcp@1.1.0", "--headless"]
  env: [ANTHROPIC_API_KEY]

# Published article numbers. Mock mode replays these exactly.
reference:
  overall_success_rate: 0.52
  partial_bonus: 0.17
  mean_duration_seconds: 130   # 2:10
  mean_actions: 11
  success_rate_by_category:
    transactional: 0.60
    data_extraction: 0.62
    migration_bulk: 0.43
    form_completion: 0.40

partial_modes:
  confirmation_not_clicked:
    weight: 0.6
    description: Reached the confirmation screen and declined to click the final submit.
  last_field_left_blank:
    weight: 0.25
    description: Main goal complete, one optional field never filled.
  verification_not_reread:
    weight: 0.15
    description: Submitted without re-reading the success banner, so completion unconfirmed.

failure_modes:
  spa_rerender_selector_loss:
    weight: 0.40
    tags: [spa_rerender, stale_state]
    description: React/Next re-render changed data-testid after interaction; selector no longer resolves.
  stale_element_reference:
    weight: 0.20
    tags: [spa_rerender, lazy_load, toggle_state]
    description: Element handle detached between observation and action.
  hidden_overlay_intercept:
    weight: 0.15
    tags: [modal_dismiss, soft_paywall, upsell_interstitial, dark_pattern]
    description: Overlay intercepted the click; the DOM reported the target as visible.
  custom_widget_unreadable:
    weight: 0.15
    tags: [custom_widgets, accessibility_overlay, unusual_layout]
    description: Non-semantic widget exposed no accessible role to act on.
  step_budget_exhausted:
    weight: 0.10
    tags: [bulk_repetition, pagination, infinite_scroll]
    description: Hit the 25-step limit before finishing the repetition loop.
